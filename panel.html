<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>api.db en vivo</title>
<!--
  Panel de la demo (Grupo 2): muestra la base SQLite de la API EN VIVO.
  Cada 0,8 s le pide GET /estado a la API, que lee la base real con
  PRAGMA table_info(...) y SELECT * FROM ... (ver registro.estado_de_la_base).
  Nada está simulado: si la fila no está en la base, no aparece acá.
  No usa librerías ni internet: es un solo archivo HTML.
-->
<style>
  :root {
    --bg: #0d1017; --panel: #141923; --panel-2: #1a2030; --borde: #252c3c; --borde-2: #323b50;
    --texto: #e7eaf1; --suave: #8f98ad; --tenue: #5f6880;
    --cian: #4cc9f0; --verde: #3ddc97; --ambar: #f5b041; --rojo: #ff6b6b; --violeta: #b9a0ff; --naranja: #ffa657;
    --verde-fondo: rgba(61, 220, 151, .16); --ambar-fondo: rgba(245, 176, 65, .20); --rojo-fondo: rgba(255, 107, 107, .14);
    --sombra: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
    --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-tema="claro"] {
    --bg: #f4f6fa; --panel: #ffffff; --panel-2: #f7f8fb; --borde: #e2e6ee; --borde-2: #d0d6e2;
    --texto: #1b2130; --suave: #5b6477; --tenue: #8a92a5;
    --cian: #0077a8; --verde: #10845c; --ambar: #a35f00; --rojo: #c0392b; --violeta: #6f42c1; --naranja: #b35900;
    --verde-fondo: rgba(16, 132, 92, .12); --ambar-fondo: rgba(214, 140, 20, .18); --rojo-fondo: rgba(192, 57, 43, .10);
    --sombra: 0 1px 2px rgba(20,30,50,.06), 0 6px 18px rgba(20,30,50,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--texto); font: 14px/1.45 var(--sans); }
  body { padding: 18px 22px 28px; }
  code, .mono { font-family: var(--mono); }

  /* ---------- encabezado ---------- */
  header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca svg { width: 34px; height: 34px; color: var(--cian); }
  .marca h1 { margin: 0; font-size: 20px; letter-spacing: .2px; }
  .marca h1 .db { font-family: var(--mono); color: var(--cian); }
  .marca p { margin: 0; color: var(--suave); font-size: 12.5px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
          border: 1px solid var(--borde-2); background: var(--panel-2); font-size: 12px; color: var(--suave); white-space: nowrap; }
  .vivo .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 0 0 var(--verde); animation: latido 1.6s infinite; }
  .vivo.caido .punto { background: var(--rojo); animation: none; }
  .vivo.caido { color: var(--rojo); border-color: var(--rojo); }
  @keyframes latido { 0% { box-shadow: 0 0 0 0 rgba(61,220,151,.55); } 70% { box-shadow: 0 0 0 8px rgba(61,220,151,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); } }
  .derecha { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button.tema { cursor: pointer; font: inherit; }

  /* ---------- último pedido: las 4 etapas ---------- */
  .ultimo { background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; box-shadow: var(--sombra); margin-bottom: 18px; overflow: hidden; }
  .ultimo .cabeza { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--borde); }
  .ultimo .cabeza h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); font-weight: 600; }
  .ruta { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .etapas { display: grid; grid-template-columns: 1fr 1.5fr 1.15fr 1fr; }
  .etapa { padding: 12px 16px 14px; border-right: 1px solid var(--borde); min-width: 0; }
  .etapa:last-child { border-right: 0; }
  .etapa h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 8px; align-items: baseline; }
  .etapa h3 small { text-transform: none; letter-spacing: 0; color: var(--tenue); font-weight: 400; }
  .e1 h3 { color: var(--cian); } .e2 h3 { color: var(--violeta); } .e3 h3 { color: var(--ambar); } .e4 h3 { color: var(--verde); }
  pre { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .lineas { font: 12.5px/1.55 var(--mono); max-height: 260px; overflow: auto; }
  .lineas div { white-space: pre-wrap; word-break: break-word; }
  .l-funcion { color: var(--violeta); font-weight: 700; }
  .l-paso { color: var(--texto); }
  .l-sql { color: var(--naranja); }
  .l-sql::before { content: "SQL› "; color: var(--tenue); }
  .l-filas { color: var(--tenue); padding-left: 3.2em; }
  .l-filas.cero { color: var(--ambar); font-weight: 700; }
  .l-error { color: var(--rojo); font-weight: 700; padding-left: 3.2em; }
  .l-valida { color: var(--tenue); font-style: italic; }
  .cambio-item { margin-bottom: 8px; font: 12.5px/1.5 var(--mono); }
  .cambio-item b { font-family: var(--sans); }
  .vacio { color: var(--tenue); font-style: italic; }
  .header-linea { color: var(--suave); }
  .header-linea.clave { color: var(--cian); font-weight: 700; }

  /* badges de método y estado */
  .metodo { font: 700 11px var(--mono); padding: 2px 7px; border-radius: 6px; letter-spacing: .04em; }
  .m-GET { color: var(--verde); background: var(--verde-fondo); }
  .m-POST { color: var(--ambar); background: var(--ambar-fondo); }
  .estado { font: 700 12px var(--mono); padding: 2px 8px; border-radius: 999px; }
  .s2 { color: var(--verde); background: var(--verde-fondo); }
  .s4 { color: var(--ambar); background: var(--ambar-fondo); }
  .s5 { color: var(--rojo); background: var(--rojo-fondo); }
  .t-INSERT { color: var(--verde); } .t-UPDATE { color: var(--ambar); } .t-DELETE { color: var(--rojo); }

  /* ---------- cuerpo: tablas + pedidos ---------- */
  .cuerpo { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
  .tablas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .tabla { background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; box-shadow: var(--sombra); overflow: hidden; min-width: 0; }
  .tabla.ancha { grid-column: 1 / -1; }
  .tabla .cabeza { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--borde); background: var(--panel-2); }
  .tabla .cabeza svg { width: 17px; height: 17px; color: var(--cian); flex: none; }
  .tabla .cabeza h3 { margin: 0; font: 700 14px var(--mono); }
  .tabla .cabeza .sql { margin-left: auto; font: 11.5px var(--mono); color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contador { font-size: 11.5px; color: var(--suave); background: var(--bg); border: 1px solid var(--borde); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .desliza { overflow: auto; max-height: 330px; }
  table { width: 100%; border-collapse: collapse; font: 13px var(--mono); }
  th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--borde-2); white-space: nowrap; }
  th .col { font-weight: 700; color: var(--texto); }
  th .tipo { display: block; font-weight: 400; font-size: 10.5px; color: var(--tenue); letter-spacing: .04em; }
  th .pk { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-size: 10px; color: var(--ambar); border: 1px solid var(--ambar); border-radius: 4px; padding: 0 4px; vertical-align: 1px; }
  td { padding: 7px 12px; border-bottom: 1px solid var(--borde); white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; }
  td.nulo { color: var(--tenue); font-style: italic; }
  tbody tr:hover td { background: var(--panel-2); }
  .sin-filas td { color: var(--tenue); font-style: italic; text-align: center; padding: 18px; }
  .bool-1 { color: var(--verde); } .bool-0 { color: var(--tenue); }
  tr.nueva td { animation: fila-nueva 3.2s ease-out both; }
  td.cambio { animation: celda-cambio 3.2s ease-out both; }
  @keyframes fila-nueva { 0% { background: var(--verde-fondo); box-shadow: inset 3px 0 0 var(--verde); } 75% { background: var(--verde-fondo); } 100% { background: transparent; } }
  @keyframes celda-cambio { 0% { background: var(--ambar-fondo); } 75% { background: var(--ambar-fondo); } 100% { background: transparent; } }
  .antes { color: var(--tenue); text-decoration: line-through; margin-right: 6px; animation: desaparece 3.2s ease-out both; }
  @keyframes desaparece { 0%, 75% { opacity: 1; } 100% { opacity: 0; display: none; } }
  .tabla.reiniciada { animation: reinicio 1.2s ease-out; }
  @keyframes reinicio { 0% { box-shadow: 0 0 0 2px var(--cian); } 100% { box-shadow: var(--sombra); } }

  /* ---------- lista de pedidos ---------- */
  .pedidos { background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; box-shadow: var(--sombra); overflow: hidden; position: sticky; top: 14px; }
  .pedidos > .cabeza { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--borde); background: var(--panel-2); }
  .pedidos > .cabeza h3 { margin: 0; font-size: 14px; }
  .lista { max-height: calc(100vh - 120px); overflow: auto; }
  .pedido { border-bottom: 1px solid var(--borde); }
  .pedido > button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; width: 100%; padding: 9px 14px; }
  .pedido > button:hover { background: var(--panel-2); }
  .pedido > button:focus-visible { outline: 2px solid var(--cian); outline-offset: -2px; }
  .pedido .n { font: 11px var(--mono); color: var(--tenue); }
  .pedido .r { font: 600 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pedido .sub { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--suave); }
  .mini { font: 11px var(--mono); padding: 0 6px; border-radius: 4px; border: 1px solid var(--borde-2); color: var(--suave); }
  .mini.clave { color: var(--cian); border-color: var(--cian); }
  .mini.repetida { color: var(--violeta); border-color: var(--violeta); }
  .mini.hilos { color: var(--tenue); }
  .pedido.entra { animation: entra .5s ease-out; }
  @keyframes entra { from { background: var(--verde-fondo); transform: translateY(-4px); } to { background: transparent; transform: none; } }
  .detalle { padding: 4px 14px 14px; display: grid; gap: 10px; }
  .detalle h4 { margin: 4px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); }
  .vacio-grande { padding: 26px 16px; text-align: center; color: var(--tenue); }

  @media (max-width: 1250px) { .etapas { grid-template-columns: 1fr 1fr; } .etapa:nth-child(2) { border-right: 0; } .etapa:nth-child(-n+2) { border-bottom: 1px solid var(--borde); } }
  @media (max-width: 1100px) { .cuerpo { grid-template-columns: 1fr; } .pedidos { position: static; } .lista { max-height: 520px; } }
  @media (max-width: 760px) { body { padding: 12px 12px 22px; } .tablas { grid-template-columns: 1fr; } .etapas { grid-template-columns: 1fr; } .etapa { border-right: 0; border-bottom: 1px solid var(--borde); } .tabla .cabeza .sql { display: none; } }
</style>
</head>
<body>
<header>
  <div class="marca">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v6.5c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8V5.5"/><path d="M4.5 12v6.5c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8V12"/>
    </svg>
    <div>
      <h1><span class="db" id="nombre-base">api.db</span> · base de datos en vivo</h1>
      <p>Lo que hay ahora en la base SQLite de la API: <code>PRAGMA table_info</code> + <code>SELECT *</code> de cada tabla, cada 0,8 s.</p>
    </div>
  </div>
  <div class="derecha">
    <span class="chip">SQLite</span>
    <span class="chip" id="cuenta">0 pedidos</span>
    <span class="chip vivo" id="vivo"><span class="punto"></span><span id="vivo-texto">conectando…</span></span>
    <button class="chip tema" id="tema" type="button">Tema claro</button>
  </div>
</header>

<section class="ultimo" id="ultimo" aria-live="polite">
  <div class="cabeza"><h2>Último pedido</h2><span class="vacio">Todavía no llegó ninguno: mandá uno desde Postman.</span></div>
</section>

<div class="cuerpo">
  <main class="tablas" id="tablas"></main>
  <aside class="pedidos">
    <div class="cabeza"><h3>Pedidos HTTP</h3><span class="contador" id="cuenta-lista">0</span></div>
    <div class="lista" id="lista"><div class="vacio-grande">Los pedidos aparecen acá a medida que llegan.</div></div>
  </aside>
</div>

<script>
"use strict";
const INTERVALO = 800;          // ms entre lecturas de la base
const DURACION = 3200;          // ms que dura el resaltado de un cambio
const ANCHAS = new Set(["conductores"]);
const ORDEN = ["conductores", "reservas", "pagos", "idempotencia", "mensajes_procesados"];   // cómo se acomodan en pantalla

let ultimoTexto = "";
let anterior = null;            // tablas de la lectura anterior: nombre -> Map(pk -> fila)
const resaltes = new Map();     // "tabla|pk" o "tabla|pk|col" -> {t, antes}
const abiertos = new Set();     // números de pedido desplegados en la lista
let numerosVistos = new Set();
let ultimoContador = 0;

const esc = v => String(v).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const clase = codigo => "s" + String(codigo)[0];
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

/* ---------- tema ---------- */
function aplicarTema(t) {
  document.documentElement.dataset.tema = t;
  document.getElementById("tema").textContent = t === "claro" ? "Tema oscuro" : "Tema claro";
  try { localStorage.setItem("tema-panel", t); } catch (e) { /* sin almacenamiento: no pasa nada */ }
}
(function () {
  let t = null;
  try { t = localStorage.getItem("tema-panel"); } catch (e) { /* idem */ }
  if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "oscuro";
  aplicarTema(t);
  document.getElementById("tema").addEventListener("click", () =>
    aplicarTema(document.documentElement.dataset.tema === "claro" ? "oscuro" : "claro"));
})();

/* ---------- formato de valores ---------- */
function celda(col, valor, extra) {
  if (valor === null || valor === undefined) return `<td class="nulo ${extra}">NULL</td>`;
  const numero = typeof valor === "number";
  let contenido = esc(valor);
  if (col.nombre === "disponible") contenido = `<span class="bool-${valor}">${valor}</span>`;
  return `<td class="${numero ? "num" : ""} ${extra}" title="${esc(valor)}">${contenido}</td>`;
}

/* ---------- tablas ---------- */
function dibujarTablas(tablas, reinicio) {
  const ahora = performance.now();
  const nuevas = new Map();
  for (const t of tablas) {
    const pk = (t.columnas.find(c => c.pk) || t.columnas[0]).nombre;
    const mapa = new Map(t.filas.map(f => [String(f[pk]), f]));
    nuevas.set(t.nombre, mapa);
    // Marcar lo que cambió respecto de la lectura anterior (no en la primera ni después de /reset)
    if (anterior && !reinicio) {
      const previo = anterior.get(t.nombre) || new Map();
      for (const [clave, fila] of mapa) {
        const vieja = previo.get(clave);
        if (!vieja) resaltes.set(`${t.nombre}|${clave}`, {t: ahora});
        else for (const c of t.columnas)
          if (vieja[c.nombre] !== fila[c.nombre]) resaltes.set(`${t.nombre}|${clave}|${c.nombre}`, {t: ahora, antes: vieja[c.nombre]});
      }
    }
  }
  if (reinicio) resaltes.clear();
  for (const [k, r] of resaltes) if (ahora - r.t >= DURACION) resaltes.delete(k);   // los vencidos
  if (resaltes.size) setTimeout(() => { ultimoTexto = ""; }, DURACION + 50);         // redibujar sin el resaltado
  anterior = nuevas;

  const ordenadas = [...tablas].sort((a, b) => ORDEN.indexOf(a.nombre) - ORDEN.indexOf(b.nombre));
  const html = ordenadas.map(t => {
    const pk = (t.columnas.find(c => c.pk) || t.columnas[0]).nombre;
    const cabeza = t.columnas.map(c => `<th><span class="col">${esc(c.nombre)}</span>${c.pk ? '<span class="pk" title="PRIMARY KEY">PK</span>' : ""}<span class="tipo">${esc(c.tipo || "—")}</span></th>`).join("");
    const filas = t.filas.length ? t.filas.map(f => {
      const clave = String(f[pk]);
      const rf = resaltes.get(`${t.nombre}|${clave}`);
      const filaNueva = rf && ahora - rf.t < DURACION;
      const celdas = t.columnas.map(c => {
        const rc = resaltes.get(`${t.nombre}|${clave}|${c.nombre}`);
        if (rc && ahora - rc.t < DURACION) {
          const demora = `style="animation-delay:-${Math.round(ahora - rc.t)}ms"`;
          const antes = `<span class="antes" ${demora}>${esc(rc.antes ?? "NULL")}</span>`;
          return celda(c, f[c.nombre], "cambio").replace("<td ", `<td ${demora} `).replace(/(<td[^>]*>)/, `$1${antes}`);
        }
        return celda(c, f[c.nombre], "");
      }).join("");
      return `<tr class="${filaNueva ? "nueva" : ""}"${filaNueva ? ` style="animation-delay:-${Math.round(ahora - rf.t)}ms"` : ""}>${celdas}</tr>`;
    }).join("") : `<tr class="sin-filas"><td colspan="${t.columnas.length}">sin filas</td></tr>`;
    return `<section class="tabla ${ANCHAS.has(t.nombre) ? "ancha" : ""} ${reinicio ? "reiniciada" : ""}" id="t-${esc(t.nombre)}">
      <div class="cabeza">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M9 9.5V20"/></svg>
        <h3>${esc(t.nombre)}</h3><span class="contador">${plural(t.filas.length, "fila", "filas")}</span>
        <span class="sql">${esc(t.sql)}</span>
      </div>
      <div class="desliza"><table><thead><tr>${cabeza}</tr></thead><tbody>${filas}</tbody></table></div>
    </section>`;
  }).join("");
  document.getElementById("tablas").innerHTML = html;
  // El resaltado de filas nuevas usa animation-delay en las celdas, para que siga donde iba
  document.querySelectorAll("tr.nueva").forEach(tr => {
    const d = tr.style.animationDelay; tr.querySelectorAll("td").forEach(td => { if (!td.classList.contains("cambio")) td.style.animationDelay = d; });
  });
}

/* ---------- un pedido: sus 4 etapas ---------- */
function lineasEventos(eventos, ruta) {
  if (ruta === "/reset") return `<div class="l-paso">db.reiniciar(): DROP TABLE + CREATE TABLE de las 5 tablas, e INSERT de Carlos y Diana</div>`;
  if (!eventos.length) return `<div class="vacio">sin pasos ni SQL</div>`;
  let html = eventos[0][0] !== "funcion" ? `<div class="l-valida">api.py valida el pedido:</div>` : "";
  for (const [tipo, a, b] of eventos) {
    if (tipo === "funcion") html += `<div class="l-funcion">→ ${esc(a)}()  <span class="l-valida">${esc(b)}</span></div>`;
    else if (tipo === "paso") html += `<div class="l-paso">· ${esc(a)}</div>`;
    else if (tipo === "sql") html += `<div class="l-sql">${esc(a)}</div>`;
    else if (tipo === "filas") html += `<div class="l-filas ${a === 0 ? "cero" : ""}">↳ ${plural(a, "fila", "filas")}</div>`;
    else if (tipo === "error") html += `<div class="l-error">↳ ✘ ${esc(a)}</div>`;
  }
  return html;
}
const valorSQL = v => typeof v === "string" ? `'${esc(v)}'` : (v === null ? "NULL" : esc(v));
function lineasCambios(p) {
  if (p.ruta === "/reset") return `<div class="l-paso">todas las tablas vuelven al estado inicial</div>`;
  if (!p.cambios.length) return `<div class="vacio">sin cambios${p.metodo === "GET" ? " — GET es seguro: solo lee" : ""}</div>`;
  return p.cambios.map(c => {
    const detalle = c.tipo === "UPDATE"
      ? Object.entries(c.columnas).map(([col, [a, d]]) => `${esc(col)}: ${valorSQL(a)} → <b class="t-UPDATE">${valorSQL(d)}</b>`).join("<br>")
      : Object.entries(c.fila).map(([col, v]) => `${esc(col)}=${valorSQL(v)}`).join(" ");
    return `<div class="cambio-item"><b>${esc(c.tabla)}</b> <b class="t-${c.tipo}">${c.tipo}</b> <span class="l-valida">(${esc(c.pk)} = ${valorSQL(c.clave)})</span><br>${detalle}</div>`;
  }).join("");
}
function jsonLindo(texto) {
  if (!texto) return "";
  try { return JSON.stringify(JSON.parse(texto), null, 2); } catch (e) { return texto; }
}
function headersHTML(lista, importantes) {
  return lista.filter(([n]) => importantes.includes(n.toLowerCase()))
    .map(([n, v]) => `<div class="header-linea ${["idempotency-key", "idempotent-replayed"].includes(n.toLowerCase()) ? "clave" : ""}">${esc(n)}: ${esc(v)}</div>`).join("");
}
const IMPORTANTES = ["content-type", "idempotency-key", "idempotent-replayed", "content-length"];

function etapas(p) {
  return `<div class="etapas">
    <div class="etapa e1"><h3>① Pedido <small>cliente → servidor</small></h3>
      <div class="lineas"><div><b>${esc(p.metodo)} ${esc(p.ruta_completa)} ${esc(p.version)}</b></div>${headersHTML(p.headers_pedido, IMPORTANTES)}<pre>${esc(jsonLindo(p.body_pedido))}</pre></div></div>
    <div class="etapa e2"><h3>② Lógica <small>capa de aplicación</small></h3><div class="lineas">${lineasEventos(p.eventos, p.ruta)}</div></div>
    <div class="etapa e3"><h3>③ Base de datos <small>capa de datos</small></h3><div class="lineas">${lineasCambios(p)}</div></div>
    <div class="etapa e4"><h3>④ Respuesta <small>servidor → cliente</small></h3>
      <div class="lineas"><div><b class="estado ${clase(p.codigo)}">${esc(p.version)} ${p.codigo} ${esc(p.frase)}</b></div>${headersHTML(p.headers_respuesta, IMPORTANTES)}<pre>${esc(jsonLindo(p.body_respuesta))}</pre></div></div>
  </div>`;
}
const repetida = p => p.headers_respuesta.some(([n, v]) => n.toLowerCase() === "idempotent-replayed" && v === "true");

function dibujarUltimo(pedidos) {
  const p = pedidos.find(x => !x.carga);
  if (!p) return;
  const funcion = p.eventos.find(e => e[0] === "funcion");
  document.getElementById("ultimo").innerHTML = `
    <div class="cabeza">
      <h2>Último pedido · #${p.numero} · ${esc(p.hora)}</h2>
      <span class="metodo m-${esc(p.metodo)}">${esc(p.metodo)}</span><span class="ruta">${esc(p.ruta)}</span>
      <span class="estado ${clase(p.codigo)}">${p.codigo} ${esc(p.frase)}</span>
      ${p.clave ? `<span class="mini clave">Idempotency-Key: ${esc(p.clave)}</span>` : ""}
      ${repetida(p) ? `<span class="mini repetida">respuesta repetida</span>` : ""}
      ${funcion ? `<span class="chip" style="margin-left:auto">${esc(funcion[1])}() · ${esc(funcion[2])}</span>` : ""}
    </div>${etapas(p)}`;
}

function dibujarLista(pedidos) {
  const lista = document.getElementById("lista");
  if (!pedidos.length) { lista.innerHTML = `<div class="vacio-grande">Los pedidos aparecen acá a medida que llegan.</div>`; return; }
  const primeraVez = numerosVistos.size === 0;
  lista.innerHTML = pedidos.map(p => {
    const nuevo = !primeraVez && !numerosVistos.has(p.numero);
    const funcion = p.eventos.find(e => e[0] === "funcion");
    const abierto = abiertos.has(p.numero);
    return `<div class="pedido ${nuevo ? "entra" : ""}">
      <button type="button" data-n="${p.numero}" aria-expanded="${abierto}">
        <span class="metodo m-${esc(p.metodo)}">${esc(p.metodo)}</span><span class="r" title="${esc(p.ruta)}">${esc(p.ruta)}</span>
        <span class="estado ${clase(p.codigo)}">${p.codigo}</span>
        <span class="sub"><span class="n">#${p.numero} · ${esc(p.hora)}</span>
          ${funcion ? `<span>${esc(funcion[1])}()</span>` : ""}
          ${p.clave ? `<span class="mini clave">${esc(p.clave)}</span>` : ""}
          ${repetida(p) ? `<span class="mini repetida">repetida</span>` : ""}
          ${p.carga ? `<span class="mini hilos">prueba con hilos</span>` : ""}
          ${p.cambios.length ? `<span class="mini">${plural(p.cambios.length, "cambio", "cambios")}</span>` : ""}
        </span>
      </button>
      ${abierto ? `<div class="detalle">
        <div><h4>② Lógica</h4><div class="lineas">${lineasEventos(p.eventos, p.ruta)}</div></div>
        <div><h4>③ Base de datos</h4><div class="lineas">${p.carga ? '<div class="vacio">en la prueba con hilos no se compara la base pedido por pedido</div>' : lineasCambios(p)}</div></div>
        <div><h4>④ Respuesta</h4><pre>${esc(jsonLindo(p.body_respuesta))}</pre></div>
      </div>` : ""}
    </div>`;
  }).join("");
  numerosVistos = new Set(pedidos.map(p => p.numero));
}
document.getElementById("lista").addEventListener("click", e => {
  const boton = e.target.closest("button[data-n]");
  if (!boton) return;
  const n = Number(boton.dataset.n);
  abiertos.has(n) ? abiertos.delete(n) : abiertos.add(n);
  ultimoTexto = "";   // forzar a redibujar
  leer();
});

/* ---------- lectura periódica ---------- */
async function leer() {
  const vivo = document.getElementById("vivo");
  try {
    const r = await fetch("/estado", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const texto = await r.text();
    vivo.classList.remove("caido");
    document.getElementById("vivo-texto").textContent = "en vivo";
    if (texto === ultimoTexto) return;
    ultimoTexto = texto;
    const estado = JSON.parse(texto);
    const nuevos = estado.pedidos.filter(p => p.numero > ultimoContador);
    const reinicio = nuevos.some(p => p.ruta === "/reset");
    ultimoContador = estado.contador;
    document.getElementById("nombre-base").textContent = estado.base;
    document.getElementById("cuenta").textContent = plural(estado.contador, "pedido", "pedidos");
    document.getElementById("cuenta-lista").textContent = estado.pedidos.length;
    dibujarTablas(estado.tablas, reinicio);
    dibujarUltimo(estado.pedidos);
    dibujarLista(estado.pedidos);
  } catch (e) {
    vivo.classList.add("caido");
    document.getElementById("vivo-texto").textContent = "sin conexión con la API";
  }
}
leer();
setInterval(leer, INTERVALO);
</script>
</body>
</html>
